<div class="pending-state"
     hx-get="/jobs/@jobId"
     hx-target="#content"
     hx-swap="innerHTML"
     hx-trigger="load delay:1s, every 1s">
  <div class="pending-animation">
    <div class="pending-dot"></div>
    <div class="pending-dot"></div>
    <div class="pending-dot"></div>
  </div>
  <div class="pending-status">@statusText&hellip;</div>
  <div class="pending-job-id">Job <code>@jobId</code></div>
</div>
